theRitual:
  label: "{LOCALE.birthsigns.theRitual.label}"
  description: "{LOCALE.birthsigns.theRitual.description}"
  bonuses:
    - bonusType: choice
      choiceGroup:
        id: theRitualPower
        prompt: "{LOCALE.birthsigns.theRitual.choices.theRitualPower.prompt}"
        choose: 1
        options:
          - id: blessedTouch
            effects:
              - bonusType: power
                bonusTargetKey: blessedTouch
          - id: blessedWord
            effects:
              - bonusType: power
                bonusTargetKey: blessedWord
          - id: marasGift
            effects:
              - bonusType: power
                bonusTargetKey: marasGift
      lifecycle:
        selection: recurring
        chooseAt: longRest
        expiresAt: nextLongRest
  starCursed:
    description: "{LOCALE.birthsigns.theRitual.starCursed.description}"
    overwriteBaseBonuses: true
    bonuses:
      - bonusType: power
        bonusTargetKey: blessedTouch
      - bonusType: power
        bonusTargetKey: blessedWord
      - bonusType: power
        bonusTargetKey: marasGift
      - bonusType: characteristic
        bonusTargetKey: lck
        bonusValue: -5
