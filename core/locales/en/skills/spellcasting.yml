alteration:
  label: Alteration
  description: |-
    Example Specializations: Burden, Armor, Repair

    This skill influences the use of spells from the school of Alteration. As a school, Alteration focuses on altering the physical and magical properties of things. Your GM may ask you to test Alteration when you try to accomplish tasks like the following...

    - Cast an Alteration spell
    - Identify the effects of Alteration magic

    For detailed rules regarding the use of this skill, see Chapter 6.

    ### Spellcasting Skills

    The skills in this section are used when casting spells from their respective spell schools. See Casting Spells (page 128) for more information about casting spells.

    Adding specializations to spellcasting skills is more specific than in the standard skills. Characters who wish to add a specialization to a spellcasting school may choose a conventional or unconventional spell that they know to specialize in. When any level of that spell is cast, standard rules for Specializations apply.
