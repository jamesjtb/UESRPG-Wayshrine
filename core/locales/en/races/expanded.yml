ayleid:
  label: Ayleids
  description: |-
    The Ayleids were descendants of the Aldmer that emigrated to Cyrodiil (from Summerset Isle). At one point they controlled the entirety of what is now the Imperial Province of Cyrodiil, and enslaved the indigenous Cyrodilic and Nordic populations. These slaves were used in various ways- to build and maintain roads and temples and to drain fields. Some Ayleids are even said to have tortured slaves for amusement. During the Slave Rebellion of 1E 242 the nearby human kingdom of Skyrim lent help to their enslaved relatives in the Ayleid Empire, which played a part in the Ayleids being overthrown by the Slave Queen Alessia and her supporters, and the subsequent shift in power from Mer to Men on Tamriel.

    It also appears that Alessia’s rebellion coincided with a civil war within the Ayleid Empire which led to many rebel Ayleid lords joining forces and aiding her in her rebellion. Though the Ayleids would continue to have a presence in Cyrodiil for several hundred years more, they were never again a major military or political power. This event signaled the beginning of the Late Ayleid Period. Their greatest fortress, White Gold Tower, was turned into the Imperial Palace by Alessia and her descendants, and it remains so to this day. The last of the Ayleids who opposed Alessia held out at a village in the vicinity of modern day Bravil and it took Alessia’s forces, led by Bravillius Tasus, four attempts to finally defeat them.

    In 1E 393 the Alessian Order sacked the ancient Ayleid temple of Malada in their attempts to eradicate all Elven presence in Cyrodiil.

    Ayleid culture lingered in the city-states that survived as client kingdoms of Alessian Cyrodiil, but most of the Elven population was finally driven into exile (largely to Valenwood) by the intolerance of the Alessian Order, though some Ayleids remained in Cyrodiil, serving as mentors and tutors for the new human nobility. The last kingdom of the Ayleids was last heard of in 1E 482 at the Battle of Glenumbria Moors. Whether the King’s people made it through the next few centuries is unknown, but this was a significant event: the age of the Ayleids had ended.

    Though the most recent reported sightings are over 1000 years old, it is possible that some tribes of Ayleids may continue to live deep within the forests of Cyrodiil even today. These Ayleids, or Wild Elves, are at best a rarity and may not have actually survived into the Third Era. The Ayleid Sage Tjurhane Fyrre talked and wrote extensively of the state of the Ayleid culture in the late First Era and early Second Era. According to Fyrre, the Ayleids of this time lived in a tribal society, with each “tribe” being substantially different from the next.

    ## Ayleid Player Characters

    Below are the rules for creating Ayleid characters. Assuming you have the permission of your GM, treat the Ayleid just as you would any other race and follow the usual steps for character creation.
dwemer:
  label: Dwemer
  description: |-
    The Dwemer, the “people of the deep”, are a fabled “Lost Race” of Mer from Dwemereth, which mostly consisted of modern-day Morrowind, where they are believed to have been the most prolific, though they also had a strong presence in Hammerfell, High Rock, and Skyrim. Meric races use the term “Dwemer”, which translates to “Deep-Elves” or “Deep Folk”. Men commonly refer to them as Dwarves. The early history of the Dwemer is still clouded in mystery. There is no known story of their dissociation from the Aldmer, which must have occurred very early in Tamrielic history, as their society bore few correlations with that of the Altmer besides some similar legal principles. The Dwemer built elaborate underground cities near and beneath mountain ranges, including the Velothi Mountains and Red Mountain, and in the mountains of the isle Stros M’Kai.

    Many misconceptions about them have abounded for centuries: scholars long thought that most Dwemer ruins which dotted Tamriel outside Morrowind were mere outposts and that there were few significant Dwemer settlements elsewhere until 1E 420. Their society consisted of free-thinking yet reclusive clans devoted to the secrets of science, engineering, and the arcane until they mysteriously disappeared around 1E 700.

    ## Dwemer Player Characters

    Below are the rules for creating Dwemer characters. Assuming you have the permission of your GM, treat the Dwemer just as you would any other race and follow the usual steps for character creation.
falmer:
  label: Falmer
  description: |-
    The Falmer (or Snow Elves) were once a proud people with an unusually great aptitude for magic. They inhabited Skyrim before the Nords returned from Atmora. They had a civilization which rivaled even the Altmer of the Summerset Isles.

    After the Night of Tears in the late Merethic Era, Ysgramor and his Five Hundred Companions launched a campaign to drive the elves from Skyrim. The Falmer’s civilization was obliterated at the Battle of the Moesring after being forced to Solstheim, which ended with the death of their leader, the Snow Prince.

    Many Falmer sought sanctuary underground with the Dwemer of Skyrim. The Falmer were eventually forced to become servants of the Dwemer and became blind through uncertain means, but eventually rebelled against their dwarven masters, ultimately coming to a climax in the War of the Crag. After the disappearance of the Dwemer, the Falmer were left to spread freely throughout Blackreach. However, centuries of subterranean slavery, combined with their permanent blindness, had left them crippled, and years of fighting the Dwemer had left the race bloodthirsty and brutal.

    A small handful of Falmer managed to avoid becoming slaves to the Dwemer, instead retreating to hidden shrines such as the Chantry of Auri-El. These few remaining Snow Elves (as they prefer to call themselves) look upon their twisted kindred (which they refer to as “the Betrayed”) with pity, which does not affect the falmer’s aggressive dispoition toward them.

    ## Falmer Player Characters

    Below are the rules for creating Falmer characters. Assuming you have the permission of your GM, treat the Falmer just as you would any other race and follow the usual steps for character creation.
maormer:
  label: Maormer
  description: |-
    The Maormer, also known as Sea Elves or Tropical Elves, are a race of mer that reside on the island of Pyandonea, south of the continent of Tamriel. They have blank eyes and colorless, chameleon-like skin, which is capable of blending in with the environment. It was originally believed that they had lived in the Altmer home of Summerset Isle and were exiled, but tapestries found in the Crystal Tower of Alinor reveal an enmity going back so far as to make that theory impossible.

    Their leader is an immortal wizard named Orgnum. The Maormer practice a snake-like magic which they use to tame sea-serpents.

    ## Maormer Player Characters

    Below are the rules for creating Maormer characters. Assuming you have the permission of your GM, treat the Maormer just as you would any other race and follow the usual steps for character creation.
sload:
  label: Sload
  description: |-
    The Sload are a race of slug-like beastfolk living in the Coral Kingdoms of Thras, somewhere southwest of Tamriel. They apparently do not experience emotions as the Tamrielic races do, but are often skilled at acting and may exaggeratedly simulate them for the benefit of more emotive beings. They will honor laws, loyalties and friendships only as long as they calculate it to be in their best interests to do so. They also have no compunctions against blasphemy, theft, kidnapping, murder, genocide or anything else that may help them reach their goals. Sload are quite skilled at magic, particularly necromancy and teleportation magics.

    Sload are not religious in any apparent sense, but will willingly serve Daedra if they benefit from it. It is unknown exactly how they reproduce - they are believed to be hermaphrodites in their youths, though the sexual organs seem to be absorbed by the time they are old enough to survive on land. Sload parents seemingly have no interest in the fate of the young, and upon reaching adulthood the Sload becomes amphibious and has an appearance similar to a large, vaguely humanoid slug.

    As they age, Sload tend to grow in size and corpulence, and many older Sload would collapse under their own weight if not buoyed up by water or by magical means. There is no known limit to either the age or the size of an adult Sload.

    ## Sload Player Characters

    Below are the rules for creating Sload characters. Assuming you have the permission of your GM, treat the Sload just as you would any other race and follow the usual steps for character creation.
