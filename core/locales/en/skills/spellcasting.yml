necromancy:
  label: Necromancy
  description: |-
    Necromancy is the dark art of death magic, and of raising the dead and creating undead monstrosities. Necromancy is fuelled by black magicks and feeds on the living, and serves as an enticing shortcut to power for the less scrupulous mages that roam Tamriel.
